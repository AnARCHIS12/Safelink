name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 1.0.1"
        required: true
        default: "1.0.1"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-linux:
    name: Build Debian and Fedora packages
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize version
        id: version
        shell: bash
        run: |
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev rpm python3-tk

      - name: Build packages
        run: |
          chmod +x packaging/linux/build-linux-packages.sh
          packaging/linux/build-linux-packages.sh "${{ steps.version.outputs.version }}"

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: release/packages/*

  build-windows:
    name: Build Windows executable
    runs-on: windows-latest
    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize version
        id: version
        shell: bash
        run: |
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: pyinstaller --clean --noconfirm SafeLink.spec

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p release/windows
          cp dist/SafeLink.exe "release/windows/SafeLink-${{ steps.version.outputs.version }}-windows-x64.exe"
          cp dist/SafeLink.exe "release/windows/SafeLink-windows-x64.exe"

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: release/windows/*

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs:
      - build-linux
      - build-windows
    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize version
        id: version
        shell: bash
        run: |
          VERSION="${VERSION#v}"
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Prepare release notes
        shell: bash
        run: |
          cat > release-notes.md <<'NOTES'
          ## SafeLink

          Téléchargements :

          - Windows : fichier `.exe`
          - Debian/Ubuntu : fichier `.deb`
          - Fedora : fichier `.rpm`

          Après installation, lancez SafeLink puis renseignez votre clé API VirusTotal.
          NOTES

      - name: Create or update release
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file release-notes.md --title "SafeLink ${{ steps.version.outputs.version }}"
          else
            gh release create "$TAG" --notes-file release-notes.md --title "SafeLink ${{ steps.version.outputs.version }}"
          fi
          gh release upload "$TAG" release-assets/**/* --clobber
